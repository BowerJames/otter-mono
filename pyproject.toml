[project]
name = "otter-mono"
version = "0.0.1"
description = "Python replication of pi-mono — tools for building AI agents and managing LLM deployments"
requires-python = ">=3.12"
license = "MIT"

[tool.uv.workspace]
members = ["otter-ai", "otter-agent-core"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pyright>=1.1",
    "ruff>=0.9",
    "types-boto3>=1.42.73",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
ignore = [
    "otter-ai/src/otter_ai/__init__.py",
    "otter-ai/src/otter_ai/oauth.py",
    "otter-ai/src/otter_ai/stream.py",
    "otter-ai/src/otter_ai/utils/oauth/__init__.py",
    "otter-agent-core/src/otter_agent_core/__init__.py",
    "otter-agent-core/tests/conftest.py",
]
reportUnusedImport = "warning"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["otter-ai/tests", "otter-agent-core/tests"]
markers = [
    "e2e: marks tests that hit real LLM APIs (deselect with '-m \"not e2e\"')",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["otter_ai", "otter_agent_core"]

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["I001"]
"otter-ai/src/otter_ai/utils/oauth/oauth_page.py" = ["E501"]

