[project]
name = "otter-ai"
version = "0.1.0"
description = "Unified multi-provider LLM API (OpenAI, Anthropic, Google, etc.)"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-core>=2.27",
    "partial-json-parser>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/otter_ai"]
